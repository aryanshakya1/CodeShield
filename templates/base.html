<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CodeShield - Secure Code Integrity Verification{% endblock %}</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-codeshield sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
        <i class="bi bi-shield-lock-fill shield-icon fs-3"></i>
        <span>CodeShield</span>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#codeshieldNav" aria-controls="codeshieldNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="codeshieldNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">
              <i class="bi bi-house-door me-1"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/sign' %}active{% endif %}" href="{{ url_for('sign_page') }}">
              <i class="bi bi-pen me-1"></i> Sign File
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/verify' %}active{% endif %}" href="{{ url_for('verify_page') }}">
              <i class="bi bi-shield-check me-1"></i> Verify File
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/security' %}active{% endif %}" href="{{ url_for('security_page') }}">
              <i class="bi bi-bug me-1"></i> Security Test
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/performance' %}active{% endif %}" href="{{ url_for('performance_page') }}">
              <i class="bi bi-speedometer2 me-1"></i> Performance
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p class="mb-1 fw-medium text-light">
        <i class="bi bi-shield-shaded text-info me-1"></i>
        CodeShield — Secure Code Integrity Verification using Digital Signatures
      </p>
      <small class="text-secondary">
        Applied Cryptography Lab Project &bull; RSA-2048 &bull; RSA-PSS &bull; SHA-256
      </small>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
